name: Keep backend and database awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint (touches the DB too)
        run: |
          code=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 55 https://mooncraft-backend.onrender.com/api/health)
          echo "HTTP $code"
          cat /tmp/health.json
          echo
          if [ "$code" != "200" ]; then
            echo "::warning::Health check returned $code — Render or the DB may be cold-starting."
          fi
